<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Dileswari ❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffe5ec 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.15);
            max-width: 400px;
            width: 85%;
            position: relative;
            z-index: 10;
            border: 1px solid #ffccd5;
        }

        h1 {
            color: #d90429;
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-family: 'Georgia', serif;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* PHOTO STYLING */
        .photo-frame {
            width: 180px;
            height: 180px;
            background-color: #fff0f3;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 5px solid #ff4d6d;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #d90429;
        }

        #noBtn {
            background-color: #e9ecef;
            color: #333;
            position: absolute;
        }

        #success-message {
            display: none;
            margin-top: 20px;
            color: #d90429;
            font-weight: bold;
            font-size: 1.5rem;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="photo-frame">
            <img src="Dileswari.jpeg" alt="Dileswari" onerror="this.style.display='none'; this.parentElement.innerText='❤️'">
        </div>

        <h1>Will you be mine?</h1>
        <p>You make every day brighter. <br>I want to spend all my tomorrows with you.</p>

        <div class="buttons">
            <button id="yesBtn" onclick="acceptProposal()">Yes! ❤️</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>

        <div id="success-message">
            I knew you'd say Yes! 💍<br>Happy Propose Day!
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function acceptProposal() {
            document.getElementById('success-message').style.display = 'block';
            document.getElementById('noBtn').style.display = 'none';
            document.querySelector('h1').innerText = "YAY!";
            
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#ff4d6d', '#ff8fa3', '#fff0f3', '#d90429'];
            for(let i=0; i<60; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = '50%';
                confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                document.body.appendChild(confetti);
            }
        }

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fall {
                to { transform: translateY(100vh) rotate(720deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
